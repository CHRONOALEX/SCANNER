<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCANNER V3 - HANDHELD OPTIMIZED</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #8a2929;
            --carbon-dark: #121212;
            --carbon-light: #1e1e1e;
            --carbon-border: #333333;
            --accent: #ffc107;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --white: #ffffff;
            --rombo-color: #00d4ff;
            --qp-color: #ff4444;
            --emissary-color: #a855f7; /* Morado para Emissary */
        }

        body { 
            font-family: 'Lexend', sans-serif; 
            margin: 0; 
            background-color: var(--carbon-dark); 
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        body.scan-success { background-color: #064e3b !important; }
        body.scan-error { background-color: #4c0505 !important; }

        nav { 
            display: flex; 
            background: #000000; 
            padding: 4px;
            gap: 4px;
            border-bottom: 1px solid var(--carbon-border);
        }

        nav button { 
            flex: 1; 
            padding: 8px 2px;
            font-size: 0.75rem;
            background: var(--carbon-light); 
            border: 1px solid var(--carbon-border); 
            border-radius: 6px;
            color: var(--text-dim); 
            font-family: 'Lexend', sans-serif;
            font-weight: 600; 
            cursor: pointer;
        }

        nav button.active { 
            color: var(--white); 
            background: var(--primary);
            border-color: var(--primary);
        }

        .container { padding: 8px; flex-grow: 1; overflow-y: auto; }
        .view { display: none; flex-direction: column; gap: 8px; }
        .view.active { display: flex; }

        .scan-card {
            background: var(--carbon-light);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--carbon-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-group {
            display: flex;
            gap: 5px;
        }

        select {
            background: #000000;
            color: var(--white);
            border: 1px solid var(--carbon-border);
            border-radius: 6px;
            padding: 8px 4px;
            font-family: 'Lexend', sans-serif;
            font-size: 0.85rem;
            outline: none;
        }

        #prov-select { flex: 0 0 35%; } 
        #list-select { flex: 1; }

        #scanner-input {
            background: #000000;
            color: var(--white);
            border: 1px solid var(--carbon-border);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Lexend', sans-serif;
            font-size: 1rem;
            flex-grow: 1;
        }

        .btn-cam {
            background: var(--primary);
            color: white; border: none; border-radius: 6px;
            padding: 0 15px; font-size: 1.2em;
        }

        .list-section {
            background: var(--carbon-light);
            border-radius: 8px;
            border: 1px solid var(--carbon-border);
            overflow: hidden;
            max-height: 50vh;
            overflow-y: auto;
        }

        .list-header {
            background: #252525;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 8px 12px; font-size: 0.65em; color: var(--text-dim); border-bottom: 1px solid var(--carbon-border); }
        td { padding: 8px 12px; border-bottom: 1px solid #1a1a1a; font-size: 0.85em; }
        
        .guia-text { font-weight: 600; color: var(--white); }
        .badge-prov { font-size: 0.7em; padding: 1px 6px; border-radius: 3px; font-weight: bold; }
        
        /* Estilos específicos por proveedor */
        .badge-rombo { color: var(--rombo-color); }
        .badge-qp { color: var(--qp-color); }
        .badge-emissary { color: var(--white); background: var(--emissary-color); }

        #error-toast {
            display: none; position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            background: #ff4444; color: white; padding: 10px 20px; border-radius: 20px;
            font-weight: bold; z-index: 2000; font-size: 0.8rem; text-align: center; width: 80%;
        }

        #camera-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #reader { width: 90%; border-radius: 10px; border: 1px solid var(--carbon-border); }
    </style>
</head>
<body>

    <div id="error-toast">DUPLICADO O FORMATO INVÁLIDO</div>

    <nav>
        <button onclick="showView('scanner-view')" id="nav-scanner" class="active">ESCÁNER</button>
        <button onclick="showView('report-view')" id="nav-report">HISTORIAL</button>
    </nav>

    <div class="container">
        <div id="scanner-view" class="view active">
            <div class="scan-card">
                <div class="select-group">
                    <select id="prov-select" onchange="selectProv(this.value)">
                        <option value="Rombo">Rombo</option>
                        <option value="QP">QP</option>
                        <option value="Emissary">Emissary</option>
                    </select>

                    <select id="list-select" onchange="selectList(this.value)">
                        <option value="Inyección NextDay">Iny. NextDay</option>
                        <option value="Inyección NextDay MP">Iny. NextDay MP</option>
                        <option value="Inyección SameDay">Iny. SameDay</option>
                        <option value="Sin Contenido">Sin Contenido</option>
                        <option value="Paquete Dañado">Paquete Dañado</option>
                        <option value="Mal Entregado">Mal Entregado</option>
                        <option value="Fuera de Cobertura">Cobertura</option>
                        <option value="Devolución a Origen / 3 Intentos">Devolución</option>
                        <option value="No Manifestado(Rojo) / TBM">No Manifestado</option>
                    </select>
                </div>

                <div style="display: flex; gap: 5px;">
                    <input type="text" id="scanner-input" placeholder="Guía..." autofocus autocomplete="off">
                    <button class="btn-cam" onclick="startCamera()">📷</button>
                </div>
            </div>

            <div class="list-section">
                <div class="list-header">
                    <span id="list-title" style="font-weight:600; font-size:0.8em;">Lista Actual</span>
                    <span id="count-per-list" style="background:var(--primary); padding:2px 6px; border-radius:8px; font-size:0.7em;">0</span>
                </div>
                <table><tbody id="scanned-list-body"></tbody></table>
            </div>
        </div>

        <div id="report-view" class="view">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 5px;">
                <button class="btn-copy" onclick="copyToSheets()" style="padding: 10px; font-size: 0.7rem;">📋 COPIAR DATOS</button>
            </div>
            <div class="list-section">
                <table>
                    <thead><tr><th>Guía</th><th>Serv.</th><th>Prov.</th></tr></thead>
                    <tbody id="report-table-body"></tbody>
                </table>
            </div>
            <button onclick="resetAllData()" style="padding:12px; background:transparent; color:#8a2929; border:1px solid #8a2929; border-radius:8px; font-weight:bold; margin-top:10px; width: 100%; font-size: 0.8rem;">BORRAR TODO</button>
        </div>
    </div>

    <div id="camera-modal">
        <div id="reader"></div>
        <button onclick="stopCamera()" style="margin-top:20px; padding:10px 30px; border-radius:20px; font-weight:bold;">CERRAR</button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOQJJ6bVevCWg58OhjCjJpjbgn-0LHyvOPM84qDdcHLfuM3Gq9Mcmk-3C-ISt2FE8zyw/exec";
        let inventory = JSON.parse(localStorage.getItem('redpack_v5')) || {}; 
        let currentListName = localStorage.getItem('redpack_last_list') || 'Inyección NextDay';
        let currentProv = localStorage.getItem('redpack_last_prov') || 'Rombo';
        let html5QrCode;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'success') {
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else {
                // Sonido de error más potente y largo para Handheld
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function showStatus(isError, msg) {
            if (isError) {
                const toast = document.getElementById('error-toast');
                toast.textContent = msg;
                toast.style.display = 'block';
                document.body.classList.add('scan-error');
                playBeep('error');
                setTimeout(() => {
                    toast.style.display = 'none';
                    document.body.classList.remove('scan-error');
                }, 1500);
            } else {
                document.body.classList.add('scan-success');
                // Vibración para éxito (si el hardware lo permite)
                if (navigator.vibrate) navigator.vibrate(60);
                playBeep('success');
                setTimeout(() => document.body.classList.remove('scan-success'), 200);
            }
        }

        async function processScan(code) {
            code = code.trim();
            if (!code) return;

            if (currentListName.toLowerCase().includes("inyección")) {
                if (!/^\d+$/.test(code) || code.length < 8 || code.length > 10) {
                    showStatus(true, "ERR: SOLO 8-10 NÚMEROS");
                    return;
                }
            } else if (code.length < 8) return;

            const dateKey = `${new Date().getDate()}/${new Date().getMonth()+1}/${new Date().getFullYear()}`;
            if (!inventory[dateKey]) inventory[dateKey] = {};
            
            for (let L in inventory[dateKey]) {
                if (inventory[dateKey][L].some(i => i.guia === code)) {
                    showStatus(true, "YA ESCANEADO EN " + L);
                    return;
                }
            }

            if (!inventory[dateKey][currentListName]) inventory[dateKey][currentListName] = [];
            inventory[dateKey][currentListName].push({ guia: code, prov: currentProv });
            localStorage.setItem('redpack_v5', JSON.stringify(inventory));
            
            showStatus(false);
            updateUI();

            fetch(WEB_APP_URL, {
                method: "POST", mode: "no-cors",
                body: JSON.stringify({ fecha: dateKey, guia: code, servicio: currentListName, proveedor: currentProv })
            });
        }

        document.addEventListener('keydown', (e) => {
            const input = document.getElementById('scanner-input');
            if (document.activeElement.tagName !== 'SELECT' && document.getElementById('scanner-view').classList.contains('active')) {
                input.focus();
            }
            if (e.key === 'Enter') {
                setTimeout(() => {
                    if (input.value) processScan(input.value);
                    input.value = '';
                }, 50);
            }
        });

        function updateUI() {
            const dateKey = `${new Date().getDate()}/${new Date().getMonth()+1}/${new Date().getFullYear()}`;
            const dayData = inventory[dateKey] || {};
            const list = dayData[currentListName] || [];
            
            document.getElementById('list-title').textContent = currentListName;
            document.getElementById('count-per-list').textContent = list.length;
            document.getElementById('prov-select').value = currentProv;
            document.getElementById('list-select').value = currentListName;
            
            document.getElementById('scanned-list-body').innerHTML = list.slice(-8).map(i => {
                let badgeClass = 'badge-rombo';
                if(i.prov === 'QP') badgeClass = 'badge-qp';
                if(i.prov === 'Emissary') badgeClass = 'badge-emissary';

                return `
                <tr>
                    <td><span class="guia-text">${i.guia}</span> <span class="badge-prov ${badgeClass}">${i.prov}</span></td>
                    <td style="text-align:right"><button onclick="deleteItem('${i.guia}')" style="color:#8a2929; background:none; border:none; font-weight:bold;">✕</button></td>
                </tr>`;
            }).reverse().join('');
            
            renderReport();
        }

        function renderReport() {
            const dateKey = `${new Date().getDate()}/${new Date().getMonth()+1}/${new Date().getFullYear()}`;
            const dayData = inventory[dateKey] || {};
            let rows = [];
            for (let L in dayData) {
                dayData[L].forEach(i => {
                    rows.push(`<tr><td class="guia-text">${i.guia}</td><td style="font-size:0.7em">${L}</td><td style="font-size:0.7em">${i.prov}</td></tr>`);
                });
            }
            document.getElementById('report-table-body').innerHTML = rows.reverse().join('');
        }

        function copyToSheets() {
            const dateKey = `${new Date().getDate()}/${new Date().getMonth()+1}/${new Date().getFullYear()}`;
            const dayData = inventory[dateKey] || {};
            let tsv = "";
            for (let L in dayData) {
                dayData[L].forEach(i => { tsv += `${dateKey}\t${i.guia}\t${L}\t${i.prov}\n`; });
            }
            if (tsv) navigator.clipboard.writeText(tsv).then(() => alert("Copiado"));
        }

        function selectProv(n) { currentProv = n; localStorage.setItem('redpack_last_prov', n); }
        function selectList(n) { currentListName = n; localStorage.setItem('redpack_last_list', n); updateUI(); }

        function deleteItem(code) {
            const dateKey = `${new Date().getDate()}/${new Date().getMonth()+1}/${new Date().getFullYear()}`;
            if (inventory[dateKey]) {
                for (let L in inventory[dateKey]) { inventory[dateKey][L] = inventory[dateKey][L].filter(i => i.guia !== code); }
            }
            localStorage.setItem('redpack_v5', JSON.stringify(inventory));
            updateUI();
        }

        function startCamera() {
            document.getElementById('camera-modal').style.display = 'flex';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 200 }, (t) => { processScan(t); stopCamera(); });
        }

        function stopCamera() { if (html5QrCode) html5QrCode.stop().then(() => document.getElementById('camera-modal').style.display = 'none'); }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-' + id.split('-')[0]).classList.add('active');
        }

        function resetAllData() { if(confirm("¿Borrar todo?")) { inventory = {}; localStorage.setItem('redpack_v5', JSON.stringify(inventory)); updateUI(); } }

        window.onload = () => { updateUI(); document.getElementById('scanner-input').focus(); };
    </script>
</body>
</html>
