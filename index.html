<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANNER V3 - INDUSTRIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #8a2929;
            --carbon-dark: #121212;
            --carbon-light: #1e1e1e;
            --carbon-border: #333333;
            --accent: #ffc107;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --white: #ffffff;
            --rombo-color: #00d4ff;
            --qp-color: #ff4444;
            --error-bg: #4c0505;
        }

        body { 
            font-family: 'Lexend', sans-serif; 
            margin: 0; 
            background-color: var(--carbon-dark); 
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        body.scan-success { background-color: #064e3b !important; }
        body.scan-error { background-color: var(--error-bg) !important; }

        nav { 
            display: flex; 
            background: #000000; 
            padding: 8px;
            gap: 8px;
            border-bottom: 1px solid var(--carbon-border);
        }

        nav button { 
            flex: 1; 
            padding: 12px 5px;
            background: var(--carbon-light); 
            border: 1px solid var(--carbon-border); 
            border-radius: 8px;
            color: var(--text-dim); 
            font-family: 'Lexend', sans-serif;
            font-weight: 600; 
            cursor: pointer;
        }

        nav button.active { 
            color: var(--white); 
            background: var(--primary);
            border-color: var(--primary);
        }

        .container { padding: 12px; flex-grow: 1; overflow-y: auto; }
        .view { display: none; flex-direction: column; gap: 12px; }
        .view.active { display: flex; }

        .scan-card {
            background: var(--carbon-light);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--carbon-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .select-group { display: flex; gap: 8px; }

        select, #scanner-input {
            background: #000000;
            color: var(--white);
            border: 1px solid var(--carbon-border);
            border-radius: 8px;
            padding: 14px;
            font-family: 'Lexend', sans-serif;
            font-size: 1em;
            outline: none;
            flex: 1;
        }

        #prov-select option[value="Rombo"] { color: var(--rombo-color); }
        #prov-select option[value="QP"] { color: var(--qp-color); }

        .btn-cam {
            background: var(--primary);
            color: white; border: none; border-radius: 8px;
            padding: 0 20px; font-size: 1.4em; cursor: pointer;
        }

        .list-section {
            background: var(--carbon-light);
            border-radius: 12px;
            border: 1px solid var(--carbon-border);
            overflow: hidden;
        }

        .list-header {
            background: #252525;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-copy {
            background: var(--accent);
            color: #000; border: none; padding: 8px 15px;
            border-radius: 6px; font-weight: 700; font-size: 0.8em; cursor: pointer;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 15px; font-size: 0.7em; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--carbon-border); }
        td { padding: 12px 15px; border-bottom: 1px solid #1a1a1a; font-size: 0.9em; }
        
        .guia-text { font-weight: 600; color: var(--white); }
        .badge-prov { font-size: 0.75em; padding: 2px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .badge-rombo { background: rgba(0, 212, 255, 0.2); color: var(--rombo-color); border: 1px solid var(--rombo-color); }
        .badge-qp { background: rgba(255, 68, 68, 0.2); color: var(--qp-color); border: 1px solid var(--qp-color); }

        /* Toast de Error para Duplicados o Filtro */
        #error-toast {
            display: none;
            position: fixed;
            top: 20%; left: 50%; transform: translateX(-50%);
            background: #ff4444; color: white;
            padding: 15px 30px; border-radius: 50px;
            font-weight: bold; z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        #camera-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #reader { width: 90%; max-width: 500px; border-radius: 15px; overflow: hidden; border: 2px solid var(--carbon-border); }
    </style>
</head>
<body>

    <div id="error-toast">DUPLICADO O FORMATO INVÁLIDO</div>

    <nav>
        <button onclick="showView('scanner-view')" id="nav-scanner" class="active">ESCÁNER</button>
        <button onclick="showView('report-view')" id="nav-report">HISTORIAL</button>
    </nav>

    <div class="container">
        <div id="scanner-view" class="view active">
            <div class="scan-card">
                <div class="select-group">
                    <select id="prov-select" onchange="selectProv(this.value)">
                        <option value="Rombo">Rombo</option>
                        <option value="QP">QP</option>
                    </select>

                    <select id="list-select" onchange="selectList(this.value)">
                        <option value="Inyección NextDay">Inyección NextDay</option>
                        <option value="Inyección NextDay MP">Inyección NextDay MP</option>
                        <option value="Inyección SameDay">Inyección SameDay</option>
                        <option value="Inyección Sameday MP">Inyección Sameday MP</option>
                        <option value="Sobre Dañado">Sobre Dañado</option>
                        <option value="Sobre sin Contenido">Sobre sin Contenido</option>
                        <option value="Mal Entregado">Mal Entregado</option>
                        <option value="Fuera de Cobertura">Fuera de Cobertura</option>
                        <option value="Devolución a Origen / 3 Intentos">Devolución a Origen / 3 Intentos</option>
                        <option value="No Manifestado(Rojo) / TBM">No Manifestado(Rojo) / TBM</option>
                    </select>
                </div>

                <div style="display: flex; gap: 8px;">
                    <input type="text" id="scanner-input" placeholder="Escanear guía..." autofocus autocomplete="off" style="flex-grow:1;">
                    <button class="btn-cam" onclick="startCamera()">📷</button>
                </div>
            </div>

            <div class="list-section">
                <div class="list-header">
                    <span id="list-title" style="font-weight:600; font-size:0.9em;">Lista Actual</span>
                    <span id="count-per-list" style="background:var(--primary); padding:2px 8px; border-radius:10px; font-size:0.8em;">0</span>
                </div>
                <table><tbody id="scanned-list-body"></tbody></table>
            </div>
        </div>

        <div id="report-view" class="view">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 5px;">
                <button class="btn-copy" onclick="copyToSheets()">📋 COPIAR PARA SHEETS</button>
            </div>
            <div class="list-section">
                <table>
                    <thead><tr><th>Fecha</th><th>Guía</th><th>Servicio</th><th>Proveedor</th></tr></thead>
                    <tbody id="report-table-body"></tbody>
                </table>
            </div>
            <button onclick="resetAllData()" style="padding:15px; background:transparent; color:#8a2929; border:1px solid #8a2929; border-radius:10px; font-weight:bold; margin-top:20px; width: 100%;">LIMPIAR TODO</button>
        </div>
    </div>

    <div id="camera-modal">
        <div id="reader"></div>
        <button onclick="stopCamera()" style="margin-top:25px; padding:12px 40px; border-radius:25px; border:none; font-weight:bold;">CERRAR</button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOQJJ6bVevCWg58OhjCjJpjbgn-0LHyvOPM84qDdcHLfuM3Gq9Mcmk-3C-ISt2FE8zyw/exec";
        let inventory = JSON.parse(localStorage.getItem('redpack_v5')) || {}; 
        let currentListName = localStorage.getItem('redpack_last_list') || 'Inyección NextDay';
        let currentProv = localStorage.getItem('redpack_last_prov') || 'Rombo';
        let html5QrCode;

        // Sonidos Industriales
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else {
                // Sonido de error doble bajo
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    osc2.connect(gain);
                    osc2.type = 'square';
                    osc2.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.2);
                }, 200);
            }
        }

        function showStatus(isError, msg) {
            if (isError) {
                const toast = document.getElementById('error-toast');
                toast.textContent = msg;
                toast.style.display = 'block';
                document.body.classList.add('scan-error');
                playBeep('error');
                setTimeout(() => {
                    toast.style.display = 'none';
                    document.body.classList.remove('scan-error');
                }, 1500);
            } else {
                document.body.classList.add('scan-success');
                playBeep('success');
                setTimeout(() => document.body.classList.remove('scan-success'), 250);
            }
        }

        function getFormatDate() {
            const d = new Date();
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        }

        async function processScan(code) {
            code = code.trim();
            if (!code) return;

            // VALIDACIÓN: Si es Inyección -> Solo números de 8 a 10 dígitos
            if (currentListName.toLowerCase().includes("inyección")) {
                const isNumeric = /^\d+$/.test(code);
                const validLength = code.length >= 8 && code.length <= 10;
                
                if (!isNumeric || !validLength) {
                    showStatus(true, "FORMATO INVÁLIDO (SOLO NÚMEROS 8-10)");
                    document.getElementById('scanner-input').value = "";
                    return;
                }
            } else if (code.length < 8) {
                return;
            }

            const dateKey = getFormatDate();
            if (!inventory[dateKey]) inventory[dateKey] = {};
            
            // Duplicados
            for (let L in inventory[dateKey]) {
                if (inventory[dateKey][L].some(item => item.guia === code)) {
                    showStatus(true, `DUPLICADO EN: ${L}`);
                    document.getElementById('scanner-input').value = "";
                    return;
                }
            }

            if (!inventory[dateKey][currentListName]) inventory[dateKey][currentListName] = [];
            
            inventory[dateKey][currentListName].push({ guia: code, prov: currentProv });
            localStorage.setItem('redpack_v5', JSON.stringify(inventory));
            
            showStatus(false);
            updateUI();

            fetch(WEB_APP_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fecha: dateKey, guia: code, servicio: currentListName, proveedor: currentProv })
            });

            document.getElementById('scanner-input').value = "";
            document.getElementById('scanner-input').focus();
        }

        // ENFOQUE GLOBAL: Para que la handheld escriba aunque no haya click en el input
        document.addEventListener('keydown', (e) => {
            const input = document.getElementById('scanner-input');
            const activeEl = document.activeElement;

            // Si no estamos en un input o select, forzar el foco al scanner-input
            if (activeEl.tagName !== 'INPUT' && activeEl.tagName !== 'SELECT' && document.getElementById('scanner-view').classList.contains('active')) {
                input.focus();
            }

            if (e.key === 'Enter') {
                setTimeout(() => {
                    const val = input.value.trim();
                    if (val) processScan(val);
                    input.value = '';
                }, 10);
            }
        });

        function updateUI() {
            const dateKey = getFormatDate();
            const dayData = inventory[dateKey] || {};
            const list = dayData[currentListName] || [];
            
            document.getElementById('list-title').textContent = currentListName;
            document.getElementById('count-per-list').textContent = list.length;
            document.getElementById('prov-select').value = currentProv;
            document.getElementById('list-select').value = currentListName;
            
            const rows = list.slice(-10).map((item) => {
                const badgeClass = item.prov === "Rombo" ? "badge-rombo" : "badge-qp";
                return `
                <tr>
                    <td><span class="guia-text">${item.guia}</span> <span class="badge-prov ${badgeClass}">${item.prov}</span></td>
                    <td style="text-align:right"><button onclick="deleteItem('${item.guia}')" style="background:none; border:none; color:#8a2929; cursor:pointer; font-weight:bold;">✕</button></td>
                </tr>`}).reverse().join('');
            
            document.getElementById('scanned-list-body').innerHTML = rows;
            renderReport();
        }

        function renderReport() {
            const dateKey = getFormatDate();
            const dayData = inventory[dateKey] || {};
            let rows = [];
            for (let L in dayData) {
                dayData[L].forEach(item => {
                    const badgeClass = item.prov === "Rombo" ? "badge-rombo" : "badge-qp";
                    rows.push(`<tr><td class="date-text">${dateKey}</td><td class="guia-text">${item.guia}</td><td><span style="font-size:0.8em; color:var(--text-dim)">${L}</span></td><td><span class="badge-prov ${badgeClass}">${item.prov}</span></td></tr>`);
                });
            }
            document.getElementById('report-table-body').innerHTML = rows.reverse().join('');
        }

        function copyToSheets() {
            const dateKey = getFormatDate();
            const dayData = inventory[dateKey] || {};
            let tsvContent = ""; 
            for (let L in dayData) {
                dayData[L].forEach(item => { tsvContent += `${dateKey}\t${item.guia}\t${L}\t${item.prov}\n`; });
            }
            if (!tsvContent) { alert("No hay datos hoy."); return; }
            navigator.clipboard.writeText(tsvContent).then(() => alert("¡Datos copiados!"));
        }

        function selectProv(name) { currentProv = name; localStorage.setItem('redpack_last_prov', name); }
        function selectList(name) { currentListName = name; localStorage.setItem('redpack_last_list', name); updateUI(); }

        function deleteItem(code) {
            const dateKey = getFormatDate();
            if (inventory[dateKey]) {
                for (let L in inventory[dateKey]) { inventory[dateKey][L] = inventory[dateKey][L].filter(i => i.guia !== code); }
            }
            localStorage.setItem('redpack_v5', JSON.stringify(inventory));
            updateUI();
        }

        function startCamera() {
            document.getElementById('camera-modal').style.display = 'flex';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 250, height: 150 } }, (text) => { 
                processScan(text); 
                stopCamera(); 
            });
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { document.getElementById('camera-modal').style.display = 'none'; });
            }
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-' + id.split('-')[0]).classList.add('active');
        }

        function resetAllData() {
            if(confirm("¿Borrar todo el historial local?")) {
                inventory = {};
                localStorage.setItem('redpack_v5', JSON.stringify(inventory));
                updateUI();
            }
        }

        window.onload = () => {
            updateUI();
            document.getElementById('scanner-input').focus();
        };
    </script>
</body>
</html>
